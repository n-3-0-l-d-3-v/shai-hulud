[package]
name = "artifact"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "artifact"
path = "src/main.rs"

[dependencies]
isa = { git = "https://github.com/n-3-0-l-d-3-v/mentat.git" }
vm = { git = "https://github.com/n-3-0-l-d-3-v/mentat.git" }
asm = { git = "https://github.com/n-3-0-l-d-3-v/mentat.git" }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
proptest = "1"
